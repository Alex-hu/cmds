<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>cmds 交互原型 B · fzf 式即时过滤</title>
<style>
  :root{
    --bg:#0b0d10; --panel:#11151a; --border:#1f2630; --text:#cdd6e0; --dim:#6b7684;
    --sel:#1c4a63; --accent:#58a6d9;
    --c-system:#8b98a5; --c-brew:#d9a441; --c-npm:#58b368; --c-conda:#3fb8af;
    --c-cargo:#d97f41; --c-go:#58a6d9; --c-rvm:#d95763; --c-app:#a78bfa; --c-manual:#6b7684;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font:14px/1.5 ui-monospace,"SF Mono",Menlo,Consolas,monospace;}
  .banner{padding:10px 16px;background:#0f1f16;border-bottom:1px solid var(--border);
    color:#9fd8ae;font-size:12px}
  #app{display:flex;flex-direction:column;height:calc(100vh - 38px);min-height:480px}
  .promptrow{display:flex;align-items:center;gap:10px;padding:14px 16px 8px;font-size:20px}
  .promptrow .chev{color:var(--accent)}
  #q{flex:1;background:transparent;border:none;outline:none;color:var(--text);
    font:inherit;font-size:20px;caret-color:var(--accent)}
  #q::placeholder{color:#3d4854}
  .meta{display:flex;gap:14px;padding:2px 18px 8px;color:var(--dim);font-size:12px;
    border-bottom:1px solid var(--border);align-items:center}
  .toggle{cursor:pointer;border:1px solid var(--border);border-radius:10px;padding:1px 10px}
  .toggle.on{color:var(--accent);border-color:var(--accent)}
  #list{flex:1;overflow:auto;padding:6px 10px}
  .item{display:flex;gap:10px;align-items:baseline;padding:4px 10px;border-radius:6px;cursor:pointer}
  .item.sel{background:var(--sel)}
  .item .name{width:250px;white-space:nowrap}
  .item mark{background:none;color:var(--accent);font-weight:bold}
  .item .ver{width:100px;color:#9aa7b4;font-size:12px}
  .item .origin{width:210px;font-size:12px}
  .item .desc{color:var(--dim);font-size:12px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .badge{display:inline-block;padding:0 7px;border-radius:8px;font-size:11px;line-height:18px;
    margin-right:4px;background:#1a212b}
  .b-system{color:var(--c-system)} .b-brew{color:var(--c-brew)} .b-npm{color:var(--c-npm)}
  .b-conda{color:var(--c-conda)} .b-cargo{color:var(--c-cargo)} .b-go{color:var(--c-go)}
  .b-rvm{color:var(--c-rvm)} .b-app{color:var(--c-app)} .b-manual{color:var(--c-manual)}
  #keybar{display:flex;gap:14px;padding:7px 12px;border-top:1px solid var(--border);
    color:var(--dim);font-size:12px;background:var(--panel)}
  kbd.k{border:1px solid var(--border);border-radius:4px;padding:0 5px;color:#a8b3bf;background:#0e1216}
  #overlay{position:fixed;inset:0;background:rgba(4,6,8,.72);display:flex;
    align-items:center;justify-content:center}
  #overlay.hidden{display:none}
  .sheet{background:var(--panel);border:1px solid #2c3947;border-radius:10px;max-width:760px;
    width:92%;max-height:84vh;overflow:auto;padding:18px 22px}
  .sheet h2{margin:0 0 2px;font-size:18px}
  .sheet .close{float:right;cursor:pointer;color:var(--dim)}
  .prov{border:1px solid var(--border);border-radius:8px;padding:10px 14px;margin:10px 0}
  .kv{display:grid;grid-template-columns:110px 1fr;gap:3px 12px;font-size:13px;margin-top:6px}
  .kv b{color:var(--dim);font-weight:normal}
  .note{color:var(--dim);font-size:12px;margin-top:8px}
  .hidden{display:none}
</style>
</head>
<body>
<div class="banner">原型 B · fzf 式即时过滤 —— 打开即输入，模糊匹配名称/描述/来源，↑↓ 选择，Enter 详情。适合"我知道命令名，想看它的来源和版本"。可与 <a href="a-tabs.html" style="color:#8fd3ff">原型 A（Tab 浏览器）</a>、<a href="c-split.html" style="color:#8fd3ff">原型 C（分栏）</a> 对比。</div>
<div id="app">
  <div class="promptrow"><span class="chev">❯</span><input id="q" autofocus
    placeholder="输入命令名 / 描述关键词 / 来源，如 tsc、python、conda…"></div>
  <div class="meta">
    <span id="count"></span>
    <span class="toggle" id="grp" onclick="toggleGrp()">同名合并</span>
    <span style="flex:1"></span>
    <span><kbd class="k">↑↓</kbd> 选择 <kbd class="k">Enter</kbd> 详情 <kbd class="k">Esc</kbd> 清空 <kbd class="k">Ctrl-J/K</kbd> 选择</span>
  </div>
  <div id="list"></div>
  <div id="keybar"><span>此形态无 tab/环境切换：来源即过滤词（输入 "conda:"、"npm@" 可直达）</span>
    <span style="flex:1"></span><span class="dim">fuzzy 匹配：子序列打分，连续命中与词首命中加权</span></div>
</div>
<div id="overlay" class="hidden"><div class="sheet" id="sheet"></div></div>
<script>
const E=[
e('zsh','system','system','5.9','Z shell，macOS 默认 shell','2025-03-14','/bin/zsh'),
e('grep','system','system','2.6.0-BSD','正则搜索文本','2025-03-14','/usr/bin/grep'),
e('ls','system','system','—','列出目录内容','2025-03-14','/bin/ls'),
e('git','brew','brew','2.47.1','分布式版本控制系统','2025-09-02','/usr/local/bin/git → …/Cellar/git/2.47.1/bin/git'),
e('jq','brew','brew','1.7.1','JSON 命令行处理器','2025-08-18','/usr/local/bin/jq'),
e('ripgrep','brew','brew','14.1.0','极速代码搜索（提供 rg）','2025-06-11','/usr/local/bin/rg'),
e('node','npm','node@brew','22.14.0','Node.js 运行时（brew 安装）','2025-09-20','/usr/local/bin/node'),
e('tsc','npm','npm@fnm/v22.12.0','5.7.2','TypeScript 编译器','2025-08-01','…/v22.12.0/…/bin/tsc'),
e('tsc','npm','npm@fnm/v22.22.0','5.8.2','TypeScript 编译器','2025-09-25','…/v22.22.0/…/bin/tsc'),
e('tsc','npm','npm@nvm/v24.3.0','5.9.0','TypeScript 编译器（dev）','2025-10-02','~/.nvm/versions/node/v24.3.0/bin/tsc'),
e('eslint','npm','npm@fnm/v22.22.0','9.18.0','JS/TS 代码检查','2025-09-25','…/v22.22.0/…/bin/eslint'),
e('tsx','npm','npm@nvm/v24.3.0','4.19.2','直接执行 TS 脚本','2025-10-02','~/.nvm/…/bin/tsx'),
e('pm2','npm','npm@fnm/v22.12.0','5.4.2','Node 进程管理器','2025-05-19','…/bin/pm2'),
e('conda','conda','conda:miniforge3/base','24.7.1','包与环境管理器','2025-04-10','~/miniforge3/bin/conda'),
e('python','conda','conda:miniforge3/base','3.11.5','Python 解释器','2025-04-10','~/miniforge3/bin/python'),
e('python','conda','conda:miniforge3/envs/ml','3.12.4','Python 解释器（ml 环境）','2025-08-22','~/miniforge3/envs/ml/bin/python'),
e('jupyter','conda','conda:miniforge3/envs/ml','1.1.1','交互式 Notebook 服务','2025-08-22','…/envs/ml/bin/jupyter'),
e('uv','conda','conda:miniforge3/envs/web','0.5.21','极速 Python 工具链','2025-09-12','…/envs/web/bin/uv'),
e('python','conda','conda:anaconda3/base','3.10.14','Python 解释器（旧安装）','2024-11-30','~/anaconda3/bin/python'),
e('sccache','cargo','cargo','0.9.1','Rust/C 编译缓存','2025-07-08','~/.cargo/bin/sccache'),
e('just','cargo','cargo','1.38.0','命令运行器，make 替代','2025-06-20','~/.cargo/bin/just'),
e('dlv','go','go','1.23.1','Go 调试器 delve','2025-07-15','~/go/bin/dlv'),
e('gopls','go','go','0.17.0','Go 语言服务器 LSP','2025-07-15','~/go/bin/gopls'),
e('ruby','rvm','rvm/ruby-3.2.2','3.2.2','Ruby 解释器','2025-02-10','~/.rvm/bin/ruby'),
e('rg','app','app:ZCode','14.1.1','ripgrep（ZCode 内嵌副本）','2025-01-05','/Applications/ZCode.app/…/ripgrep/rg'),
e('my-script','manual','manual','—','自写的杂项脚本','2025-10-01','/usr/local/bin/my-script'),
];
function e(name,source,origin,version,desc,installed,path){return{name,source,origin,version,desc,installed,path}}
const CN={system:'系统',brew:'brew',npm:'node/npm',conda:'conda',cargo:'cargo',go:'go',rvm:'rvm',app:'app',manual:'manual'};
let st={q:'',sel:0,grp:false};
function fuzzy(needle,hay){
  const n=needle.toLowerCase(),h=hay.toLowerCase();
  let score=-1,idx=[],pi=0,prev=-2;
  for(const ch of n){pi=h.indexOf(ch,pi);if(pi<0)return null;
    score+=1+(pi===prev+1?2:0)+(/[^a-z0-9]/.test(h[pi-1]||'')?3:0)+(pi===0?4:0);
    idx.push(pi);prev=pi;pi++;}
  return{score,idx};
}
function scored(){
  const out=[];
  for(const x of E){
    const r=st.q?fuzzy(st.q,x.name):{score:0,idx:[]};
    const hitDesc=st.q&&x.desc.toLowerCase().includes(st.q.toLowerCase());
    const hitOrigin=st.q&&x.origin.toLowerCase().includes(st.q.toLowerCase());
    if(st.q&&!r&&!hitDesc&&!hitOrigin)continue;
    out.push({x,nameScore:r?r.score:-9999,idx:r?r.idx:[],
      total:(r?r.score:0)+(hitDesc?6:0)+(hitOrigin?8:0)});
  }
  out.sort((a,b)=>a.total-b.total||a.x.name.localeCompare(b.x.name));
  if(!st.grp)return out;
  const seen=new Map();
  for(const o of out){if(!seen.has(o.x.name))seen.set(o.x.name,[]);
    seen.get(o.x.name).push(o);}
  return[...seen.values()].map(g=>({x:g[0].x,idx:g[0].idx,provs:g.map(p=>p.x)}));
}
function hl(name,idx){
  if(!idx.length)return name;
  let s='';for(let i=0;i<name.length;i++){
    s+=idx.includes(i)?`<mark>${name[i]}</mark>`:name[i];}
  return s;
}
function badge(s,label){return`<span class="badge b-${s}">${label??CN[s]}</span>`}
function render(){
  const rows=scored(),list=document.getElementById('list');
  list.innerHTML='';
  rows.forEach((r,i)=>{
    const d=document.createElement('div');
    d.className='item'+(i===st.sel?' sel':'');
    const provs=r.provs||[r.x];
    const src=provs.length>1
      ?provs.map(p=>badge(p.source,p.origin.includes(':')?p.origin.split(':').pop():p.origin)).join('')
      :badge(r.x.source,r.x.source==='conda'?r.x.origin.split(':').pop():r.x.origin);
    d.innerHTML=`<span class="name">${hl(r.x.name,r.idx)}${provs.length>1?` <span style="color:var(--dim);font-size:11px">×${provs.length}</span>`:''}</span>
      ${src}<span class="ver">${r.x.version}</span><span class="desc">${r.x.desc}</span>`;
    d.onclick=()=>{st.sel=i;render()};
    d.ondblclick=()=>openDetail(r);
    list.appendChild(d);
  });
  if(st.sel>=rows.length)st.sel=Math.max(0,rows.length-1);
  document.getElementById('count').textContent=st.q
    ?`${rows.length}/${E.length} 命中 “${st.q}”`:`共 ${E.length} 条（输入即过滤）`;
  const selEl=list.children[st.sel];if(selEl)selEl.scrollIntoView({block:'nearest'});
}
function toggleGrp(){st.grp=!st.grp;document.getElementById('grp').classList.toggle('on',st.grp);render()}
function openDetail(r){
  const provs=r.provs||[r.x];
  document.getElementById('sheet').innerHTML=
    `<span class="close" onclick="closeDetail()">[Esc] 关闭 ✕</span>
     <h2>${r.x.name}${provs.length>1?`<span style="color:var(--dim);font-size:13px"> · ${provs.length} 个提供者</span>`:''}</h2>
     ${provs.map(p=>`<div class="prov">${badge(p.source)}<span style="font-size:12px">${p.origin}</span>
       <div class="kv"><b>VERSION</b><span>${p.version}</span><b>INSTALLED</b><span>${p.installed}（近似）</span>
       <b>PATH</b><span>${p.path}</span><b>DESC</b><span>${p.desc}</span></div></div>`).join('')}
     ${provs.length>1?`<div class="note">同名多来源：按 PATH 顺序靠前者生效。</div>`:''}`;
  document.getElementById('overlay').classList.remove('hidden');
}
function closeDetail(){document.getElementById('overlay').classList.add('hidden')}
document.getElementById('overlay').onclick=ev=>{if(ev.target.id==='overlay')closeDetail()};
const q=document.getElementById('q');
q.oninput=()=>{st.q=q.value;st.sel=0;render()};
q.onkeydown=ev=>{
  if(ev.key==='ArrowDown'||(ev.ctrlKey&&ev.key==='j')){ev.preventDefault();
    st.sel=Math.min(scored().length-1,st.sel+1);render()}
  if(ev.key==='ArrowUp'||(ev.ctrlKey&&ev.key==='k')){ev.preventDefault();
    st.sel=Math.max(0,st.sel-1);render()}
  if(ev.key==='Enter'){const rows=scored();if(rows.length)openDetail(rows[st.sel])}
  if(ev.key==='Escape'){q.value='';st.q='';st.sel=0;render()}
};
render();q.focus();
</script>
</body>
</html>
