<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>cmds 交互原型 C · 分栏浏览器</title>
<style>
  :root{
    --bg:#0b0d10; --panel:#11151a; --border:#1f2630; --text:#cdd6e0; --dim:#6b7684;
    --sel:#1a2332; --accent:#58a6d9;
    --c-system:#8b98a5; --c-brew:#d9a441; --c-npm:#58b368; --c-conda:#3fb8af;
    --c-cargo:#d97f41; --c-go:#58a6d9; --c-rvm:#d95763; --c-app:#a78bfa; --c-manual:#6b7684;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font:14px/1.5 ui-monospace,"SF Mono",Menlo,Consolas,monospace;}
  .banner{padding:10px 16px;background:#22101a;border-bottom:1px solid var(--border);
    color:#f0a8c0;font-size:12px}
  #app{display:grid;grid-template-columns:190px 380px 1fr;gap:0;
    height:calc(100vh - 38px);min-height:480px}
  aside{border-right:1px solid var(--border);overflow:auto;padding:8px 0}
  .src{display:flex;justify-content:space-between;padding:5px 14px;cursor:pointer;color:var(--dim)}
  .src:hover{color:var(--text)}
  .src.on{color:var(--text);background:var(--sel);box-shadow:inset 3px 0 0 var(--accent)}
  .env{padding:4px 14px 4px 34px;cursor:pointer;font-size:12px;color:var(--dim)}
  .env:hover{color:var(--text)}
  .env.on{color:var(--c-conda);background:#0f1e20}
  main{border-right:1px solid var(--border);display:flex;flex-direction:column}
  .listhead{padding:8px 12px 6px;border-bottom:1px solid var(--border);display:flex;gap:8px;align-items:center}
  #filter{flex:1;background:var(--panel);border:1px solid var(--border);border-radius:4px;
    color:var(--text);padding:4px 8px;font:inherit;outline:none}
  #filter:focus{border-color:var(--accent)}
  #list{flex:1;overflow:auto}
  .row{display:flex;gap:10px;padding:4px 12px;cursor:pointer;border-bottom:1px solid #141a21}
  .row .nm{width:170px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .vr{width:86px;color:#9aa7b4;font-size:12px}
  .row .og{flex:1;color:var(--dim);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row.sel{background:var(--sel);box-shadow:inset 3px 0 0 var(--accent)}
  #detail{overflow:auto;padding:14px 18px}
  #detail h2{margin:0 0 4px;font-size:18px}
  .badge{display:inline-block;padding:0 7px;border-radius:8px;font-size:11px;line-height:18px;
    margin-right:4px;background:#1a212b}
  .b-system{color:var(--c-system)} .b-brew{color:var(--c-brew)} .b-npm{color:var(--c-npm)}
  .b-conda{color:var(--c-conda)} .b-cargo{color:var(--c-cargo)} .b-go{color:var(--c-go)}
  .b-rvm{color:var(--c-rvm)} .b-app{color:var(--c-app)} .b-manual{color:var(--c-manual)}
  .prov{border:1px solid var(--border);border-radius:8px;padding:10px 14px;margin:10px 0}
  .prov.cur{border-color:#2c5a3f}
  .prov .eff{color:var(--c-npm);font-size:12px}
  .kv{display:grid;grid-template-columns:110px 1fr;gap:3px 12px;font-size:13px;margin-top:6px}
  .kv b{color:var(--dim);font-weight:normal}
  .note{color:var(--dim);font-size:12px;margin-top:8px}
  #keybar{position:fixed;bottom:0;left:0;right:0;display:flex;gap:14px;padding:6px 12px;
    border-top:1px solid var(--border);color:var(--dim);font-size:12px;background:rgba(17,21,26,.96)}
  kbd.k{border:1px solid var(--border);border-radius:4px;padding:0 5px;color:#a8b3bf;background:#0e1216}
</style>
</head>
<body>
<div class="banner">原型 C · 分栏浏览器 —— 左侧来源树（conda 可展开到各环境），中间命令列表，右侧实时详情（无需回车）。适合"闲逛式"探索机器上装了什么。可与 <a href="a-tabs.html" style="color:#8fd3ff">原型 A（Tab 浏览器）</a>、<a href="b-fuzzy.html" style="color:#8fd3ff">原型 B（fzf 式）</a> 对比。</div>
<div id="app">
  <aside id="srcbar"></aside>
  <main>
    <div class="listhead"><input id="filter" placeholder="过滤…  （按 / 聚焦）"></div>
    <div id="list"></div>
  </main>
  <section id="detail"></section>
</div>
<div id="keybar">
  <span><kbd class="k">j</kbd>/<kbd class="k">k</kbd> 或 <kbd class="k">↑↓</kbd> 移动（详情实时刷新）</span>
  <span><kbd class="k">/</kbd> 过滤</span>
  <span><kbd class="k">1-9</kbd> 详情中切换同名提供者</span>
  <span><kbd class="k">q</kbd> 退出</span>
</div>
<script>
const E=[
e('zsh','system','system','5.9','Z shell，macOS 默认 shell','2025-03-14','/bin/zsh','binary'),
e('grep','system','system','2.6.0-BSD','正则搜索文本','2025-03-14','/usr/bin/grep','binary'),
e('ls','system','system','—','列出目录内容','2025-03-14','/bin/ls','binary'),
e('git','brew','brew','2.47.1','分布式版本控制系统','2025-09-02','/usr/local/bin/git → …/Cellar/git/2.47.1/bin/git','binary'),
e('jq','brew','brew','1.7.1','JSON 命令行处理器','2025-08-18','/usr/local/bin/jq','binary'),
e('wget','brew','brew','1.25.0','网络文件下载','2025-07-30','/usr/local/bin/wget','binary'),
e('ripgrep','brew','brew','14.1.0','极速代码搜索（提供 rg）','2025-06-11','/usr/local/bin/rg','binary'),
e('node','npm','node@brew','22.14.0','Node.js 运行时（brew 安装）','2025-09-20','/usr/local/bin/node','binary'),
e('tsc','npm','npm@fnm/v22.12.0','5.7.2','TypeScript 编译器','2025-08-01','…/v22.12.0/…/bin/tsc','script'),
e('pm2','npm','npm@fnm/v22.12.0','5.4.2','Node 进程管理器','2025-05-19','…/bin/pm2','script'),
e('tsc','npm','npm@fnm/v22.22.0','5.8.2','TypeScript 编译器','2025-09-25','…/v22.22.0/…/bin/tsc','script'),
e('eslint','npm','npm@fnm/v22.22.0','9.18.0','JS/TS 代码检查','2025-09-25','…/bin/eslint','script'),
e('tsc','npm','npm@nvm/v24.3.0','5.9.0','TypeScript 编译器（dev）','2025-10-02','~/.nvm/…/bin/tsc','script'),
e('tsx','npm','npm@nvm/v24.3.0','4.19.2','直接执行 TS 脚本','2025-10-02','~/.nvm/…/bin/tsx','script'),
e('conda','conda','conda:miniforge3/base','24.7.1','包与环境管理器','2025-04-10','~/miniforge3/bin/conda','binary'),
e('python','conda','conda:miniforge3/base','3.11.5','Python 解释器','2025-04-10','~/miniforge3/bin/python','binary'),
e('mamba','conda','conda:miniforge3/base','1.5.9','并发版 conda 前端','2025-04-10','~/miniforge3/bin/mamba','binary'),
e('python','conda','conda:miniforge3/envs/ml','3.12.4','Python 解释器（ml 环境）','2025-08-22','~/miniforge3/envs/ml/bin/python','binary'),
e('jupyter','conda','conda:miniforge3/envs/ml','1.1.1','交互式 Notebook 服务','2025-08-22','…/envs/ml/bin/jupyter','script'),
e('pip','conda','conda:miniforge3/envs/ml','24.2','Python 包安装器','2025-08-22','…/envs/ml/bin/pip','script'),
e('uvicorn','conda','conda','0.32.0','ASGI Web 服务器','2025-09-12','…/envs/web/bin/uvicorn','script'),
e('uv','conda','conda:miniforge3/envs/web','0.5.21','极速 Python 工具链','2025-09-12','…/envs/web/bin/uv','binary'),
e('python','conda','conda:anaconda3/base','3.10.14','Python 解释器（旧安装）','2024-11-30','~/anaconda3/bin/python','binary'),
e('sccache','cargo','cargo','0.9.1','Rust/C 编译缓存','2025-07-08','~/.cargo/bin/sccache','binary'),
e('just','cargo','cargo','1.38.0','命令运行器，make 替代','2025-06-20','~/.cargo/bin/just','binary'),
e('sd','cargo','cargo','1.0.0','sed 的现代替代','2025-06-20','~/.cargo/bin/sd','binary'),
e('dlv','go','go','1.23.1','Go 调试器 delve','2025-07-15','~/go/bin/dlv','binary'),
e('gopls','go','go','0.17.0','Go 语言服务器 LSP','2025-07-15','~/go/bin/gopls','binary'),
e('ruby','rvm','rvm/ruby-3.2.2','3.2.2','Ruby 解释器','2025-02-10','~/.rvm/bin/ruby','binary'),
e('rg','app','app:ZCode','14.1.1','ripgrep（ZCode 内嵌副本）','2025-01-05','/Applications/ZCode.app/…/ripgrep/rg','binary'),
e('ugrep','app','app:ZCode','7.0.2','ugrep 搜索器','2025-01-05','/Applications/ZCode.app/…/ugrep','binary'),
e('my-script','manual','manual','—','自写的杂项脚本','2025-10-01','/usr/local/bin/my-script','script'),
];
function e(name,source,origin,version,desc,installed,path,kind){return{name,source,origin,version,desc,installed,path,kind}}
const CN={system:'系统',brew:'brew',npm:'node/npm',conda:'conda',cargo:'cargo',go:'go',rvm:'rvm',app:'app',manual:'manual'};
const SRCS=['all','system','brew','npm','conda','cargo','go','rvm','app','manual'];
let st={src:'all',env:'',sel:0,filter:'',provIdx:0,condaOpen:true};
function envs(){return[...new Set(E.filter(x=>x.source==='conda').map(x=>x.origin))].sort()}
function rows(){
  let r=E.filter(x=>st.src==='all'||x.source===st.src);
  if(st.env)r=r.filter(x=>x.origin===st.env);
  if(st.filter){const q=st.filter.toLowerCase();
    r=r.filter(x=>(x.name+' '+x.desc+' '+x.origin).toLowerCase().includes(q));}
  const g=new Map();for(const x of r){if(!g.has(x.name))g.set(x.name,[]);
    g.get(x.name).push(x);}
  return[...g.entries()].map(([name,provs])=>({name,provs}));
}
function badge(s,label){return`<span class="badge b-${s}">${label??CN[s]}</span>`}
function renderSrc(){
  const bar=document.getElementById('srcbar');bar.innerHTML='';
  for(const s of SRCS){
    const cnt=s==='all'?new Set(E.map(x=>x.name)).size:E.filter(x=>x.source===s).length;
    const d=document.createElement('div');
    d.className='src'+(st.src===s&&!st.env?' on':'');
    d.innerHTML=`<span>${s==='all'?'All':CN[s]}</span><span>${cnt}</span>`;
    d.onclick=()=>{st.src=s;st.env='';st.sel=0;render()};
    bar.appendChild(d);
    if(s==='conda'&&st.src==='conda'){
      for(const env of envs()){
        const short=env.slice(env.indexOf(':')+1);
        const ed=document.createElement('div');
        ed.className='env'+(st.env===env?' on':'');
        const cnt2=E.filter(x=>x.origin===env).length;
        ed.textContent=`${short} · ${cnt2}`;
        ed.onclick=()=>{st.env=st.env===env?'':env;st.sel=0;render()};
        bar.appendChild(ed);
      }
    }
  }
}
function renderList(){
  const rs=rows(),list=document.getElementById('list');list.innerHTML='';
  rs.forEach((r,i)=>{
    const p0=r.provs[0];
    const d=document.createElement('div');
    d.className='row'+(i===st.sel?' sel':'');
    const og=r.provs.length>1
      ?r.provs.map(p=>badge(p.source,p.origin.split(':').pop().split('/').pop())).join('')
      :`<span>${p0.origin}</span>`;
    d.innerHTML=`<span class="nm">${r.name}${r.provs.length>1?` ×${r.provs.length}`:''}</span>
      <span class="vr">${p0.version}</span><span class="og">${og}</span>`;
    d.onclick=()=>{st.sel=i;st.provIdx=0;renderList();renderDetail()};
    list.appendChild(d);
  });
  if(st.sel>=rs.length)st.sel=Math.max(0,rs.length-1);
  const selEl=list.children[st.sel];if(selEl)selEl.scrollIntoView({block:'nearest'});
  return rs;
}
function renderDetail(){
  const rs=rows(),r=rs[st.sel];if(!r)return;
  const provs=r.provs;
  const eff=provs.find(p=>p.source!=='app')||provs[0];
  document.getElementById('detail').innerHTML=
    `<h2>${r.name}${provs.length>1?`<span style="color:var(--dim);font-size:13px"> · ${provs.length} 个提供者（按 1-${provs.length} 切换）</span>`:''}</h2>
     ${provs.map((p,i)=>`<div class="prov${p===eff?' cur':''}">
       ${p===eff?'<div class="eff">● 当前生效（PATH 中最前）</div>':''}
       ${badge(p.source)}<span style="font-size:12px">${p.origin}${st.provIdx===i?' ←':''}</span>
       <div class="kv"><b>VERSION</b><span>${p.version}</span>
       <b>KIND</b><span>${p.kind}</span><b>INSTALLED</b><span>${p.installed}（近似）</span>
       <b>PATH</b><span>${p.path}</span><b>DESC</b><span>${p.desc}</span></div></div>`).join('')}
     ${provs.length>1?`<div class="note">同名多来源：按 PATH 目录顺序，靠前者遮蔽靠后者。</div>`:''}
     <div class="note">此分栏形态的特点：详情常驻可见，无需 Enter；conda 环境在左栏点选，无独立 tab 概念。</div>`;
}
function render(){renderSrc();const n=renderList().length;renderDetail();
  document.title=`(${n}) cmds 交互原型 C · 分栏浏览器`}
const filterEl=document.getElementById('filter');
filterEl.oninput=()=>{st.filter=filterEl.value;st.sel=0;render()};
document.onkeydown=ev=>{
  const typing=ev.target===filterEl;
  if(typing){if(ev.key==='Escape')filterEl.blur();return}
  if(ev.key==='/'&&!typing){ev.preventDefault();filterEl.focus();return}
  const rs=rows();
  if(ev.key==='ArrowDown'||ev.key==='j'){ev.preventDefault();
    st.sel=Math.min(rs.length-1,st.sel+1);render();return}
  if(ev.key==='ArrowUp'||ev.key==='k'){ev.preventDefault();
    st.sel=Math.max(0,st.sel-1);render();return}
  if(/^[1-9]$/.test(ev.key)&&rs[st.sel]&&+ev.key<=rs[st.sel].provs.length){
    st.provIdx=+ev.key-1;renderDetail();return}
};
render();
</script>
</body>
</html>
